\* TLC configuration for EmissionContract.
\* Real code: emit idempotency keyed by (epoch, ci). One source delta and a
\* single restart expose the effective-once violation (outbox resurrection
\* across an epoch bump). Set IdempotentEmit = TRUE for the fix variant, which
\* keys idempotency on the source commit index and makes EffectiveOnce hold.
SPECIFICATION Spec

CONSTANTS
    NumDeltas      = 1
    MaxEpoch       = 2
    IdempotentEmit = FALSE

INVARIANT TypeOK
INVARIANT EffectiveOnce
